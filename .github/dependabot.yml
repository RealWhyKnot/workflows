version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /lint/typescript/merge
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      lint-tools:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /lint/css/merge
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      lint-tools:
        update-types: [minor, patch]
