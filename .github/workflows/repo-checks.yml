name: Repo checks

on:
  workflow_call:
    inputs:
      pins:
        description: What an outdated or branch-pinned third-party action does. warn, fail or off.
        type: string
        required: false
        default: warn
      ignore-ecosystems:
        description: Newline-separated Dependabot ecosystems this repo deliberately leaves out.
        type: string
        required: false
        default: ""
      actionlint:
        description: Lint the workflows with actionlint and shellcheck.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow syntax
        uses: RealWhyKnot/workflows/workflow-syntax@v1

      - name: Conformance
        uses: RealWhyKnot/workflows/conformance@v1
        with:
          pins: ${{ inputs.pins }}
          ignore-ecosystems: ${{ inputs.ignore-ecosystems }}

      - name: actionlint
        if: inputs.actionlint && hashFiles('.github/lint/repo_checks.sh') == ''
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true

      - name: Set up lint tools
        if: hashFiles('.github/lint/repo_checks.sh') != ''
        uses: RealWhyKnot/workflows/setup-lint-tools@v1

      - name: Run repo checks
        if: hashFiles('.github/lint/repo_checks.sh') != ''
        shell: bash
        env:
          CI: "true"
        run: bash .github/lint/repo_checks.sh
