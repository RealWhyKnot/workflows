name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: actions on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path . -Filter 'Test-*.ps1' -Recurse |
            Where-Object { $_.FullName -notmatch '[\/]\.git[\/]' } |
            Sort-Object FullName)
          if (-not $tests) { throw 'No Test-*.ps1 found. The suite would pass by finding nothing.' }
          $failed = @()
          foreach ($t in $tests) {
            $rel = Resolve-Path -Relative $t.FullName
            Write-Host "::group::$rel"
            $global:LASTEXITCODE = 0
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $rel }
            Write-Host '::endgroup::'
          }
          Write-Host "Ran $($tests.Count) test script(s)."
          if ($failed) { throw "Failed: $($failed -join ', ')" }

  lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: true

      - name: Check this repo against itself
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          $global:LASTEXITCODE = 0
          & ./workflow-syntax/Assert-WorkflowSyntax.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./conformance/Assert-Conformance.ps1 -Root . -Fork "$env:FORK"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  powershell:
    name: PowerShell style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Quiet

      - name: Lint PowerShell
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          & ./lint/Install-Lint.ps1 -RepoRoot . -Lang powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.github/lint/Invoke-PSLint.ps1
          exit $LASTEXITCODE
