name: Workflow syntax
description: Parse every tracked PowerShell file and every inline pwsh run block under .github/workflows.

inputs:
  root:
    description: Repository root to scan. Defaults to the workspace.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check PowerShell and workflow syntax
      shell: pwsh
      env:
        ROOT: ${{ inputs.root }}
      run: |
        $root = if ($env:ROOT) { $env:ROOT } else { '${{ github.workspace }}' }
        & '${{ github.action_path }}/Assert-WorkflowSyntax.ps1' -Root $root
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
