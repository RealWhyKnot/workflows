name: Nightly tag plan
description: Decide whether main has functional changes since the last tag, and what the next same-day nightly tag should be.

inputs:
  timezone:
    description: Timezone whose calendar date the tag uses.
    required: false
    default: America/Chicago
  suffix:
    description: Prerelease suffix appended after the revision. Empty gives a plain tag.
    required: false
    default: beta
  tag-glob:
    description: Glob for finding the nearest tag.
    required: false
    default: 'v*'
  ignore-paths:
    description: Newline-separated path globs that never change the program, added to the beta gate defaults.
    required: false
    default: ''
  release-types:
    description: Conventional commit types that ship. Empty uses the beta gate defaults.
    required: false
    default: ''

outputs:
  has_changes:
    description: true when a commit since the nearest tag passes the beta gate.
    value: ${{ steps.plan.outputs.has_changes }}
  next_tag:
    description: The tag to create, empty when there is nothing to do.
    value: ${{ steps.plan.outputs.next_tag }}

runs:
  using: composite
  steps:
    - name: Plan the nightly tag
      id: plan
      shell: pwsh
      env:
        TIMEZONE: ${{ inputs.timezone }}
        SUFFIX: ${{ inputs.suffix }}
        TAG_GLOB: ${{ inputs.tag-glob }}
        IGNORE_PATHS: ${{ inputs.ignore-paths }}
        RELEASE_TYPES: ${{ inputs.release-types }}
      run: |
        $global:LASTEXITCODE = 0
        & '${{ github.action_path }}/Get-NightlyTagPlan.ps1' `
          -Timezone "$env:TIMEZONE" `
          -Suffix "$env:SUFFIX" `
          -TagGlob "$env:TAG_GLOB" `
          -IgnorePaths "$env:IGNORE_PATHS" `
          -ReleaseTypes "$env:RELEASE_TYPES"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
