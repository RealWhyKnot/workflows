name: Set up lint tools
description: Install pinned repository checkers on Ubuntu x64.

runs:
  using: composite
  steps:
    - name: Install lint tools
      shell: bash
      env:
        TYPOS_VERSION: "1.52.2"
        TYPOS_SHA256: "3b13d1291281d39d01822e54035636487a7a0f228e70097899b1e33aeb0e7e93"
        ZIZMOR_VERSION: "1.32.0"
        ZIZMOR_SHA256: "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        CARGO_DENY_VERSION: "0.20.2"
        CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      run: |
        set -euo pipefail
        shopt -s inherit_errexit
        if [[ ${RUNNER_OS} != Linux || ${RUNNER_ARCH} != X64 ]]; then
          printf '%s\n' 'Lint tools need an Ubuntu x64 runner.' >&2
          exit 1
        fi
        download_directory=$(mktemp -d)
        trap 'rm -rf -- "${download_directory}"' EXIT
        tool_directory='${{ runner.temp }}/lint-tools/bin'
        typos_release_url="https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}"
        curl -fsSL --max-time 60 --retry 3 \
          "${typos_release_url}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          -o "${download_directory}/typos.tar.gz"
        zizmor_release_url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}"
        curl -fsSL --max-time 60 --retry 3 \
          "${zizmor_release_url}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
          -o "${download_directory}/zizmor.tar.gz"
        gitleaks_release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        curl -fsSL --max-time 60 --retry 3 \
          "${gitleaks_release_url}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o "${download_directory}/gitleaks.tar.gz"
        cargo_deny_release_url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}"
        cargo_deny_archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
        curl -fsSL --max-time 60 --retry 3 \
          "${cargo_deny_release_url}/${cargo_deny_archive}.tar.gz" \
          -o "${download_directory}/cargo-deny.tar.gz"
        actionlint_release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
        curl -fsSL --max-time 60 --retry 3 \
          "${actionlint_release_url}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          -o "${download_directory}/actionlint.tar.gz"
        printf '%s  %s\n' \
          "${TYPOS_SHA256}" "${download_directory}/typos.tar.gz" \
          "${ZIZMOR_SHA256}" "${download_directory}/zizmor.tar.gz" \
          "${GITLEAKS_SHA256}" "${download_directory}/gitleaks.tar.gz" \
          "${CARGO_DENY_SHA256}" "${download_directory}/cargo-deny.tar.gz" \
          "${ACTIONLINT_SHA256}" "${download_directory}/actionlint.tar.gz" | sha256sum -c
        mkdir -p "${tool_directory}"
        tar -xzf "${download_directory}/typos.tar.gz" -C "${tool_directory}" ./typos
        tar -xzf "${download_directory}/zizmor.tar.gz" -C "${tool_directory}" zizmor
        tar -xzf "${download_directory}/gitleaks.tar.gz" -C "${tool_directory}" gitleaks
        tar -xzf "${download_directory}/cargo-deny.tar.gz" -C "${tool_directory}" \
          --strip-components=1 "${cargo_deny_archive}/cargo-deny"
        tar -xzf "${download_directory}/actionlint.tar.gz" -C "${tool_directory}" actionlint
        chmod 755 "${tool_directory}/typos" "${tool_directory}/zizmor" "${tool_directory}/gitleaks" \
          "${tool_directory}/cargo-deny" "${tool_directory}/actionlint"
        printf '%s\n' '${{ runner.temp }}/lint-tools/bin' >> "${GITHUB_PATH}"
        "${tool_directory}/typos" --version
        "${tool_directory}/zizmor" --version
        "${tool_directory}/gitleaks" version
        "${tool_directory}/cargo-deny" --version
        "${tool_directory}/actionlint" -version
